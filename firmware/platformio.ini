; Firmware do nó sensor de PM2,5.
; Compilado e verificado com o core Arduino do ESP32 2.0.17 (plataforma oficial "espressif32")
; e 3.3.12 (para usar o core 3.x no PlatformIO, troque "platform" pela plataforma pioarduino, por exemplo
; https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip).
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -Wall
lib_deps =
    adafruit/Adafruit BME280 Library@^2.3.0
    adafruit/Adafruit Unified Sensor@^1.1.15
    adafruit/DHT sensor library@^1.4.7
